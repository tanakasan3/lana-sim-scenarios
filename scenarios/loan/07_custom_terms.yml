# Loan 07: Custom Terms
# Pattern: Use non-standard inline terms with explicit start date
# Demonstrates: Custom annual rate, 6-month duration, liquidation enabled
name: custom_terms
description: "Loan with custom non-standard terms and explicit start date"
customer_suffix: "7-custom-terms"

# Explicit start date (instead of offset)
start_date: "2025-06-15"

# Custom terms - intentionally NOT matching any std_terms helper
terms:
  annual_rate: 8.5          # Non-standard rate
  duration_months: 6        # 6 months instead of 3 or 12
  interest_due_days: 5      # 5 days grace period
  overdue_days: 30          # 30 days overdue
  liquidation_days: 45      # Auto-liquidation at 45 days
  accrual_interval: EndOfDay
  accrual_cycle_interval: EndOfMonth
  one_time_fee_rate: 0.02   # 2% one-time fee
  initial_cvl: 150          # Higher initial CVL
  margin_call_cvl: 130
  liquidation_cvl: 110
  disbursal_policy: SingleDisbursal

# Amounts
facility_amount_usd: 5_000_000
deposit_amount_usd: 5_000_000
collateral_btc: 150
expected_duration_days: 190  # ~6 months

steps:
  # Setup
  - action: create_customer
    suffix: "7-custom-terms"
  
  - action: make_deposit
    amount_usd: 5_000_000
  
  # Create facility with custom inline terms (not std_terms)
  - action: create_proposal
    amount_usd: 5_000_000
    terms: custom  # This triggers use of inline terms builder
  
  - action: customer_approve
  
  - action: wait_for_approval
  
  # Activate with collateral
  - action: update_collateral
    collateral_btc: 150
  
  - action: wait_for_activation
  
  # Payment behavior - pay on time
  - action: on_obligation_due
    behavior: pay_immediately
  
  # End condition
  - action: advance_to_expected_end
    days: 190
  
  - action: pay_remaining_outstanding
  
  - action: complete_facility
